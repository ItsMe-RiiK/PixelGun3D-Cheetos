name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: built-binaries
          path: release-bins
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse Version
        id: version
        run: |
          # The branch in a tag push is the tag name itself (e.g. v1.0.0)
          TAG_NAME="${{ github.event.workflow_run.head_branch }}"
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          # Parse the major version from the tag
          if [[ "$TAG_NAME" =~ ^v([0-9]+) ]]; then
            echo "major=v${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
          else
            echo "major=${TAG_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Archive Old Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all releases
          releases=$(gh release list --json tagName,name -L 100) || releases="[]"
          current_major="${{ steps.version.outputs.major }}"
          
          echo "$releases" | jq -c '.[]' | while read release; do
            tag=$(echo "$release" | jq -r .tagName)
            name=$(echo "$release" | jq -r .name)
            
            # Skip the current major version release (this is the one we want to keep active!)
            if [ "$tag" = "${{ steps.version.outputs.major }}" ]; then
              continue
            fi
            
            # Archive ANY other release that is not the current major version
            if [[ "$name" != *"[Archived]"* ]]; then
              echo "Archiving older release $tag..."
              gh release edit "$tag" --title "[Archived] $name" || true
            fi
          done

      - name: Cleanup Old Tags
        run: |
          # Fetch all tags from remote
          git fetch --tags
          
          # List all full version tags (v*.*.*), sorted by version number
          tags=$(git tag -l "v*.*.*" | sort -V)
          
          # Count total tags
          tag_count=$(echo "$tags" | wc -l)
          
          # If more than 2 tags exist, delete the older ones
          if [ "$tag_count" -gt 2 ]; then
            tags_to_delete=$(echo "$tags" | head -n -2)
            for t in $tags_to_delete; do
              echo "Deleting old tag: $t"
              git push origin --delete "$t" || true
            done
          else
            echo "Only $tag_count full version tags exist. Keeping them all."
          fi

      - name: Generate Release Notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ## Latest version of PG3D: ${{ steps.version.outputs.tag }}
          
          ###
          EOF
          
          # We can use GitHub's generated notes
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="${{ steps.version.outputs.tag }}" \
            --jq .body >> release_notes.md || echo "See commits for full changelog." >> release_notes.md

      - name: Cleanup Old Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the release exists first
          if gh release view ${{ steps.version.outputs.major }} > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.major }} exists. Cleaning up old assets..."
            # Get list of asset names
            assets=$(gh release view ${{ steps.version.outputs.major }} --json assets -q '.assets[].name') || assets=""
            for asset in $assets; do
              echo "Deleting old asset: $asset"
              gh release delete-asset ${{ steps.version.outputs.major }} "$asset" -y || true
            done
          else
            echo "Release ${{ steps.version.outputs.major }} does not exist yet."
          fi

      - name: Create Release Archive
        run: |
          # Create a root folder for the archive
          mkdir -p PG3D-Cheetos
          
          # Copy the pre-built binaries
          cp release-bins/* PG3D-Cheetos/
          
          # Copy only the run scripts (exclude build and updateOffset scripts)
          cp scripts/runLinux.sh scripts/runWindows.bat PG3D-Cheetos/
          
          # Package everything into a zip file
          zip -r PG3D-Release-${{ steps.version.outputs.tag }}.zip PG3D-Cheetos/

          # Update the major tag (e.g. v0) to point to the latest commit we just pushed
          git tag -fa ${{ steps.version.outputs.major }} -m "Update major tag" || true
          git push origin -f ${{ steps.version.outputs.major }} || true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.major }}
          name: PG3D ${{ steps.version.outputs.major }}
          body_path: release_notes.md
          files: PG3D-Release-${{ steps.version.outputs.tag }}.zip
